service: api-clientes

provider:
  name: aws
  runtime: nodejs20.x
  environment:
    EVENTOS_TABLE: eventos
    IS_OFFLINE: ${env:IS_OFFLINE, 'false'}


  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
          Resource: "*"

functions: ${file(./config/serverless/functions.local.yaml)}

# resources:
